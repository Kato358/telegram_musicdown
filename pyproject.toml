[project]
name = "telgram-musicdown"
version = "0.1.5"
description = "Telegram 音乐下载器 — 单进程 FastAPI + Kurigram 应用"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.5",
    # 发行名 Kurigram；导入名仍是 pyrogram（分支沿用上游包路径，见 §[tool.mypy] overrides）
    "kurigram>=2.2",
    "mutagen>=1.47",
    "pyyaml>=6.0",
    # 在线源（app/chksz）：搜索/解析走 JSON，请求，取音频要流式下载
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.8",
    "ruff>=0.4",
    "types-PyYAML>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "E", "W",       # pycodestyle
  "F",            # pyflakes
  "I",            # isort
  "B",            # bugbear
  "UP",           # pyupgrade
  "ASYNC",        # async 陷阱
  "S",            # bandit
  "SIM",          # 简化
  "PTH",          # pathlib
  "RET",          # return 简化
  "T20",          # 禁止 print
  "PL",           # pylint 子集
]
ignore = ["PLR0913", "PLR0917"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]
"run.py" = ["T201", "S603", "UP036"]
# 冒烟脚本：要真 Key 与真网络，按脚本读法豁免 print/assert
"smoke_chksz.py" = ["T201", "S101", "PLR0915", "PLR2004", "BLE001", "SLF001", "ANN204", "PLC0415"]

[tool.mypy]
# 全量覆盖 app/（不只 services/db/utils）：web/telegram 层曾因不在 files 里而漏检，
# 导致 IStore 协议漂移（delete_history/set_history_media）长期无声通过。
python_version = "3.11"
strict = true
files = ["app"]
[[tool.mypy.overrides]]
module = ["app.web.routes.*", "app.web.*"]
disallow_untyped_defs = false
[[tool.mypy.overrides]]
module = ["app.services.tags"]
disallow_untyped_calls = false
[[tool.mypy.overrides]]
# Kurigram 自带 py.typed，`pyrogram.*` 的标注会被真实检查，故不再 ignore
module = ["mutagen.*", "uvicorn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# 裸 pytest 不把 cwd 注入 sys.path（python -m 才会）：tests 包跨目录互导必须显式给根。
pythonpath = ["."]
# Windows proactor 传输对象在解释器退出 GC 时的 ResourceWarning：对象分配自
# Kurigram 测试桩建事件循环，属测试侧噪音，不是业务句柄泄漏（业务句柄由
# app/utils/logfile 的 close() 收口）。
filterwarnings = ["ignore:unclosed transport:ResourceWarning"]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
